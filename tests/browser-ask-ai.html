<!doctype html><html lang="en"><meta charset="utf-8">
<title>Ask AI selection regression</title>
<link rel="stylesheet" href="/static/ask-ai.css">
<style>body{font:18px/1.6 system-ui;margin:2rem}article{max-width:38rem}pre{white-space:pre-wrap}</style>
<h1 id="test-status">RUNNING Ask AI selection regression</h1>
<main><article>
  <h2 id="sec-0">A chapter</h2>
  <p id="p-1">Changing a text selection by dragging its native handle must keep the Ask AI action available.</p>
</article></main>
<pre id="report"></pre>
<script>window.outcrop={lang:'en',site:'Selection fixture',title:'A chapter',chapter:'Sample.Use'};</script>
<script defer src="/static/ask-ai.js"></script>
<script>
window.addEventListener('load', async () => {
  const status=document.querySelector('#test-status');
  const report=document.querySelector('#report');
  const checks=[];
  const paragraph=document.querySelector('#p-1');
  const source=paragraph.firstChild;
  const trigger=document.querySelector('.ask-ai-trigger');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  function check(label,condition){
    checks.push(`${condition?'PASS':'FAIL'} ${label}`);
    report.textContent=checks.join('\n');
    if(!condition)throw Error(label);
  }
  function select(end){
    const range=document.createRange();
    range.setStart(source,0);
    range.setEnd(source,end);
    getSelection().removeAllRanges();
    getSelection().addRange(range);
    document.dispatchEvent(new Event('selectionchange'));
  }
  try{
    select(24);
    await wait(140);
    check('initial selection shows action',!trigger.hidden);
    paragraph.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerType:'touch'}));
    check('touch adjustment hides old action',trigger.hidden);
    select(65);
    // Native selection handles on iOS need not deliver pointerup to the document.
    await wait(140);
    check('adjusted selection restores action without pointerup',!trigger.hidden);
    select(40);
    await wait(140);
    check('further handle adjustment keeps action visible',!trigger.hidden);
    trigger.click();
    const dialog=document.querySelector('.ask-ai-dialog');
    check('action uses final selection',dialog.open&&dialog.textContent.includes(source.textContent.slice(0,40)));
    dialog.close();
    getSelection().removeAllRanges();
    document.dispatchEvent(new Event('selectionchange'));
    await wait(140);
    check('clearing selection hides action',trigger.hidden);
    select(24);
    await wait(140);
    paragraph.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerType:'mouse'}));
    select(50);
    paragraph.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerType:'mouse'}));
    await wait(140);
    check('desktop drag release still shows action',!trigger.hidden);
    status.textContent=`PASS ${checks.length}/${checks.length} Ask AI selection regression`;
  }catch(error){status.textContent=`FAIL Ask AI selection regression: ${error.message}`;console.error(error);}
});
</script></html>
