<!doctype html><meta charset="utf-8"><title>Independent textbook instances</title>
<style>body{font:14px system-ui}iframe{width:390px;height:780px;max-width:100%;border:1px solid #aaa}pre{white-space:pre-wrap}</style>
<h1 id="test-status">RUNNING independent site regression</h1>
<iframe id="frame"></iframe><pre id="report"></pre>
<script>
(async()=>{
  const frame=document.querySelector('#frame'),checks=[],report=document.querySelector('#report');
  const keys=['theme','code-palettes','reading-progress-v1','current-route','lang','toc-collapsed']
    .flatMap(key=>['lantern-notes','prism-reader'].map(prefix=>prefix+'-'+key));
  const saved=Object.fromEntries(keys.map(key=>[key,localStorage.getItem(key)]));
  const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  function check(name,ok){checks.push({name,ok:!!ok});report.textContent=JSON.stringify(checks,null,2);if(!ok)throw Error(name);}
  async function until(fn){const start=Date.now();while(!fn()){if(Date.now()-start>30000)throw Error('Timed out');await pause(60);}}
  async function load(path){frame.src=path;await new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=reject;});await until(()=>frame.contentWindow.outcropAppearance&&frame.contentDocument.querySelector('.compact-done'));return [frame.contentDocument,frame.contentWindow];}
  try{
    keys.forEach(key=>localStorage.removeItem(key));
    let [doc,win]=await load('/academy/en/Sample.Use.html');
    check('alternate brand and icon',doc.querySelector('#brand').textContent==='Lantern Notes'&&doc.querySelector('.brand-logo').src.includes('/academy/static/assets/logo.svg'));
    check('no instance branding leaks',!doc.body.innerText.includes('Bedrock')&&!doc.documentElement.innerHTML.includes('bedrock.institute'));
    check('subpath canonical',doc.querySelector('[rel=canonical]').href==='https://lantern.example/academy/en/Sample.Use.html');
    check('compiler definitions preserved',doc.querySelectorAll('a[data-type]').length>5);
    check('real expression metadata rendered',doc.querySelectorAll('.expr-node').length>=2);
    check('review status and QED retained',doc.querySelector('.chapter-review')&&doc.querySelector('.agda-definition-end'));
    // QED is a watermark, not an extra source row. Use real reader resources,
    // including dynamic insertion, resizing, scrolling and folded statements.
    const probe=doc.createElement('div');
    probe.innerHTML='<pre class="Agda"><span class="agda-code-content">x</span></pre><pre class="Agda"><span class="agda-code-content">x</span><span class="agda-definition-end" style="--definition-line:0" role="img" aria-label="End of definition"></span></pre>';
    doc.querySelector('article').append(probe);
    const ordinary=probe.firstElementChild,ending=probe.lastElementChild,pre=ending,code=pre.firstElementChild,mark=ending.lastElementChild;
    for(const width of [375,1100]) {
      frame.style.width=width+'px';
      for(const mode of ['light','dark']) {
        win.outcropAppearance.setMode(mode);code.textContent='x';await pause(100);
        const prefix=width+' '+mode+' QED ';
        check(prefix+'does not reserve height',pre.offsetHeight===ordinary.offsetHeight&&win.getComputedStyle(pre).paddingBottom===win.getComputedStyle(ordinary).paddingBottom);
        check(prefix+'uses exact non-interactive glyph',win.getComputedStyle(mark,'::after').content==='"∎"'&&win.getComputedStyle(mark,'::after').pointerEvents==='none');
        const glyph=win.getComputedStyle(mark,'::after');
        check(prefix+'retains the original prose-side font and size',glyph.fontFamily===win.getComputedStyle(doc.body).fontFamily&&Math.abs(parseFloat(glyph.fontSize)-1.05*parseFloat(win.getComputedStyle(doc.documentElement).fontSize))<.05);
        const quiet=Number(win.getComputedStyle(mark,'::after').opacity);
        check(prefix+'uses fixed opacity over empty space',quiet===.25);
        code.textContent='x'.repeat(240);await pause(100);
        check(prefix+'keeps fixed opacity over visible code',Number(win.getComputedStyle(mark,'::after').opacity)===quiet);
        code.textContent='x'.repeat(240)+'\nx';await pause(100);
        check(prefix+'keeps fixed opacity with a long earlier line',Number(win.getComputedStyle(mark,'::after').opacity)===quiet);
      }
    }
    frame.style.width='375px';
    code.textContent='x'.repeat(241)+'\n'+' '.repeat(240)+'y';code.scrollLeft=0;await pause(100);
    check('QED keeps fixed opacity with clipped final-line code',win.getComputedStyle(mark,'::after').opacity==='0.25');
    code.scrollLeft=code.scrollWidth;await pause(100);
    check('QED keeps fixed opacity when scrolled over the final token',win.getComputedStyle(mark,'::after').opacity==='0.25');
    code.scrollLeft=0;await pause(100);
    check('QED keeps fixed opacity when code scrolls away',win.getComputedStyle(mark,'::after').opacity==='0.25');
    const fold=doc.createElement('details');fold.innerHTML='<summary>Nested statement</summary>';probe.append(fold);fold.append(ending);
    code.textContent='x'.repeat(240);fold.open=true;await pause(100);
    check('QED keeps fixed opacity after opening a submodule-like fold',win.getComputedStyle(mark,'::after').opacity==='0.25');
    check('QED never enters copied code',!pre.textContent.includes('∎'));
    code.textContent=Array.from({length:80},()=> 'x').join('\n');await pause(100);
    check('long Agda blocks grow instead of scrolling vertically',pre.clientHeight>80*parseFloat(win.getComputedStyle(pre).fontSize)&&win.getComputedStyle(code).overflowY==='hidden');
    check('Agda code retains horizontal scrolling',win.getComputedStyle(code).overflowX==='auto');
    const later=mark.cloneNode(true);later.style.setProperty('--definition-line','2');pre.append(later);
    for(const size of ['14px','21px']) {
      pre.style.fontSize=size;await pause(100);
      const distance=later.getBoundingClientRect().top-mark.getBoundingClientRect().top;
      check('definition line anchors follow '+size+' code',Math.abs(distance-2*parseFloat(win.getComputedStyle(pre).lineHeight))<1);
    }
    pre.style.fontSize='';later.remove();
    const proof=doc.createElement('p');proof.className='prose-proof';proof.textContent='Proof. The code follows.';
    pre.before(proof);await pause(100);
    check('proof/code spacing remains compact without QED wrappers',parseFloat(win.getComputedStyle(proof).marginBottom)<=8&&parseFloat(win.getComputedStyle(pre).marginTop)<=8);
    probe.remove();frame.style.width='390px';await pause(100);
    check('no horizontal overflow at 390',doc.documentElement.scrollWidth<=390);
    const searchToggle=doc.querySelector('#search-toggle'),languageToggle=doc.querySelector('#language-toggle');
    const searchPanel=doc.querySelector('.search-form'),languagePanel=doc.querySelector('#lang-switch');
    for(const mode of ['light','dark']) {
      win.outcropAppearance.setMode(mode);
      check(mode+' compact controls start closed',searchPanel.inert&&languagePanel.inert);
      const headerButtons=[searchToggle,languageToggle,doc.querySelector('#theme-toggle')];
      for(const button of headerButtons) {
        const rect=button.getBoundingClientRect();
        check(mode+' labelled touch-safe '+button.id,rect.width>=44&&rect.height>=44&&!!button.getAttribute('aria-label'));
      }
      const rects=headerButtons.map(button=>button.getBoundingClientRect());
      check(mode+' compact buttons use a four-pixel gap',rects.slice(1).every((rect,i)=>Math.abs(rect.left-rects[i].right-4)<.1));
      check(mode+' compact buttons align to the right gutter',Math.abs(doc.documentElement.clientWidth-rects[2].right-4)<.1);
      headerButtons[2].focus();
      const focusStyle=win.getComputedStyle(headerButtons[2]);
      check(mode+' rightmost focus ring remains inside the viewport',rects[2].right+parseFloat(focusStyle.outlineOffset)+parseFloat(focusStyle.outlineWidth)<=doc.documentElement.clientWidth+.1);
      languageToggle.click();await pause(160);
      check(mode+' language disclosure is visible',!languagePanel.inert&&win.getComputedStyle(languagePanel).visibility==='visible'&&languageToggle.getAttribute('aria-expanded')==='true');
      searchToggle.click();await pause(160);
      check(mode+' search replaces language disclosure',languagePanel.inert&&!searchPanel.inert&&doc.activeElement.id==='search-box'&&win.getComputedStyle(searchPanel).visibility==='visible');
      doc.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
      check(mode+' Escape closes and restores focus',searchPanel.inert&&doc.activeElement===searchToggle);
      searchToggle.click();doc.querySelector('article').click();
      check(mode+' outside click closes search',searchPanel.inert);
    }
    frame.style.width='1100px';await pause(100);
    check('wide header retains inline controls',!searchPanel.inert&&!languagePanel.inert&&win.getComputedStyle(searchToggle).display==='none');
    frame.style.width='390px';await pause(100);
    check('return to compact layout closes disclosures',searchPanel.inert&&languagePanel.inert);
    check('footer uses concise framework credit and repository',doc.querySelector('.footer-credit').textContent==='Powered by Outcrop'&&doc.querySelector('.footer-credit a').href==='https://github.com/BedrockInstitute/Outcrop');
    check('upstream credit is not a reader footer',!doc.querySelector('#site-footer').textContent.includes('1lab'));
    win.outcropAppearance.setMode('light');win.outcropAppearance.setPalette('light','github');
    doc.querySelector('.compact-done').click();
    check('first completion persists',JSON.parse(localStorage.getItem('lantern-notes-reading-progress-v1')).includes('Sample.Use'));
    check('first namespace theme written',localStorage.getItem('lantern-notes-theme')==='light');
    [doc,win]=await load('/prism/en/Sample.Use.html');
    check('second brand and prefix',doc.querySelector('#brand').textContent==='Prism Reader'&&doc.querySelector('#brand').getAttribute('href')==='/prism/en/index.html');
    check('second footer uses the same concise framework credit',doc.querySelector('.footer-credit').textContent==='Powered by Outcrop');
    check('second completion starts independent',doc.querySelector('.compact-done').getAttribute('aria-pressed')==='false');
    check('second palette starts independent',doc.documentElement.dataset.codePalette==='default');
    win.outcropAppearance.setMode('dark');win.outcropAppearance.setPalette('dark','solarized');
    check('second namespace does not alter first',localStorage.getItem('lantern-notes-theme')==='light'&&localStorage.getItem('prism-reader-theme')==='dark');
    [doc,win]=await load('/academy/en/Sample.Use.html');
    check('return restores first theme and palette',doc.documentElement.classList.contains('theme-light')&&doc.documentElement.dataset.codePalette==='github');
    check('return restores first completion',doc.querySelector('.compact-done').getAttribute('aria-pressed')==='true');
    const mirror=await fetch('/academy/en/Sample.Use.md').then(r=>r.text());
    check('ordinary Markdown mirror has no intermediate markers',mirror.includes('```agda\ntwice')&&!mirror.includes('\u0000'));
    check('source path is configured md',mirror.includes('https://code.example/lantern/text/chapters/Sample/Use.md')&&!mirror.includes('src/'));
    check('mirror guide is absolute and preserves deployment prefix',mirror.includes('agent_guide: https://lantern.example/academy/llms.txt\n'));
    const guide=await fetch('/academy/llms.txt').then(r=>r.text());
    check('agent layer is independently branded',guide.includes('Lantern Notes')&&!guide.includes('bedrock.institute')&&!guide.includes('Base.Prelude'));
    const types=await fetch('/academy/en/types/Sample.Use.json').then(r=>r.json());
    check('real compiler sidecar applications',Object.keys(types.$expressions||{}).length>=2);
    const content=await fetch('/academy/search-content.json').then(r=>r.json());
    check('index has three languages and code', ['en','zh','ja','*'].every(lang=>content.some(x=>x.lang===lang)));
    for(const width of [390,1100]) {
      frame.style.width=width+'px';
      [doc,win]=await load('/academy/en/Sample.Use.html');
      const box=doc.querySelector('#search-box'),results=doc.querySelector('#search-results');
      const focusSearch=()=>{if(width===390&&doc.querySelector('.search-form').inert)doc.querySelector('#search-toggle').click();box.focus()};
      focusSearch();
      box.value='twice';box.focus();
      box.dispatchEvent(new win.Event('input',{bubbles:true}));
      await until(()=>results.querySelector('a.res'));
      const result=results.querySelector('a.res'),target=new URL(result.href);
      check(width+' search result is a native link',target.pathname.startsWith('/academy/en/')&&!!target.hash);
      box.dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true,cancelable:true}));
      check(width+' keyboard result selection remains accessible',box.getAttribute('aria-activedescendant')===result.id);
      // Safari pointer activation may blur to the body, not focus the link.
      result.dispatchEvent(new win.PointerEvent('pointerdown',{bubbles:true,pointerType:width===390?'touch':'mouse'}));
      box.blur();
      check(width+' input blur cannot remove the pending click target',!results.hidden&&result.getClientRects().length>0);
      result.click();
      await until(()=>win.location.pathname===target.pathname&&win.location.hash===target.hash);
      check(width+' result activates its real page anchor without a modal',!!doc.getElementById(decodeURIComponent(target.hash.slice(1)))&&!doc.querySelector('.definition-modal'));
      focusSearch();await until(()=>!results.hidden&&results.querySelector('a.res'));
      doc.querySelector('#theme-toggle').focus();
      check(width+' moving focus outside dismisses results',results.hidden);
      focusSearch();await until(()=>!results.hidden&&results.querySelector('a.res'));
      box.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));
      check(width+' Escape dismisses results',results.hidden&&box.getAttribute('aria-expanded')==='false');
    }
    // CSS viewport pixels, not panel resolution: cover scaled laptop widths
    // and both sides of the drawer breakpoint, across all reading measures.
    frame.style.maxWidth='none';
    for(const lang of ['en','zh','ja']) {
      [doc,win]=await load('/academy/'+lang+'/Sample.Use.html');
      for(const width of [1280,1440,1512,1728]) {
        frame.style.width=width+'px';await pause(100);
        const toc=doc.querySelector('#toc'),article=doc.querySelector('article');
        const side=toc.getBoundingClientRect(),body=article.getBoundingClientRect();
        check(lang+' '+width+' adaptive sidebar remains visible',win.getComputedStyle(toc).position==='sticky'&&win.getComputedStyle(toc).visibility==='visible'&&side.width>=160&&side.width<=320);
        check(lang+' '+width+' sidebar fits without moving the reading centre',side.right<body.left&&Math.abs((body.left+body.right)/2-width/2)<1&&doc.documentElement.scrollWidth<=width);
        const left=body.left;
        doc.querySelector('#toc-collapse').click();await pause(100);
        check(lang+' '+width+' manual collapse keeps reading position',win.getComputedStyle(toc).display==='none'&&Math.abs(article.getBoundingClientRect().left-left)<1);
        doc.querySelector('#nav-toggle').click();await pause(100);
        check(lang+' '+width+' desktop toggle restores sidebar',toc.getBoundingClientRect().width>0&&doc.querySelector('#nav-toggle').getAttribute('aria-expanded')==='true');
      }
      frame.style.width='1279px';await pause(100);
      doc.querySelector('#nav-toggle').click();await pause(250);
      check(lang+' below breakpoint opens a drawer',doc.body.classList.contains('nav-open')&&win.getComputedStyle(doc.querySelector('#toc')).position==='fixed');
      frame.style.width='1280px';await pause(250);
      check(lang+' growing out of drawer clears backdrop',!doc.body.classList.contains('nav-open')&&win.getComputedStyle(doc.querySelector('#nav-backdrop')).display==='none');
    }
    frame.style.maxWidth='';frame.style.width='390px';
    const plain=await fetch('/plain.html').then(r=>r.text());
    check('raw core renders unknown code without fake semantic links',plain.includes('unknown value')&&!plain.includes('data-type=')&&!plain.includes('expr-node'));
    document.querySelector('#test-status').textContent='PASS '+checks.length+'/'+checks.length;
  }catch(error){document.querySelector('#test-status').textContent='FAIL '+error.message;}
  finally{for(const[key,value]of Object.entries(saved))value===null?localStorage.removeItem(key):localStorage.setItem(key,value);}
})();
</script>
