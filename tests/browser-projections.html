<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projection notation regression</title>
<link rel="stylesheet" href="/static/outcrop.css">
<link rel="stylesheet" href="/static/appearance.css"><link rel="stylesheet" href="/static/deep-notation/styles.css">
<script>window.outcrop={lang:'en',chapter:'ProjectionFixture',storageNamespace:'projection-fixture',vectorNotation:['Example.Vector.Vec']};</script>
<script src="/static/appearance.js"></script>
<script type="module" src="/static/outcrop.js"></script>
</head><body><header id="site-header"><button id="theme-toggle">Appearance</button></header><h1 id="status">RUNNING</h1><main id="main-content"><article id="fixture">
<p>Single-letter receiver, long receiver, function application, and raw opt-out:</p>
<code class="Agda inline-ref" id="pair">p .<a class="Field" data-pair-projection="1" href="/zh/Base.Prelude.html">fst</a></code>
<code class="Agda inline-ref" id="long">pair .<a class="Field" data-pair-projection="1">fst</a></code>
<code class="Agda inline-ref" id="application">g p .<a class="Field" data-pair-projection="2">snd</a></code>
<code class="Agda inline-ref" id="raw" data-outcrop-notation="source">p .<a class="Field" data-pair-projection="1">fst</a></code>
<p>Unknown same-spelled field and an import remain raw:</p>
<code class="Agda inline-ref" id="unknown">p .<a class="Field">fst</a></code>
<code class="Agda inline-ref" id="import">using ( <a class="Field" data-pair-projection="1">fst</a> )</code>
<p>Compiler-backed record projection and an ineligible long field:</p>
<pre class="Agda" id="record"><span class="expr-node" data-projection-head="S" data-projection-argument="𝒮">S 𝒮</span></pre>
<pre class="Agda" id="record-long"><span class="expr-node" data-projection-head="isSetS" data-projection-argument="𝒮">isSetS 𝒮</span></pre>
<pre class="Agda" id="record-complex"><span class="expr-node" data-projection-head="S" data-projection-argument="𝒮 ↾ M">S (𝒮 ↾ M)</span></pre>
<pre class="Agda" id="multi"><span class="expr-node">x = <span class="expr-node">p <a class="Symbol">.</a><a id="field-anchor" class="Field" data-pair-projection="2">snd</a></span></span></pre>
<div id="results"></div></article></main>
<script>
const vectorCases = [
 ['vector','Vec A n',true], ['vector-greek','Vec 𝒮 ℓ',true], ['vector-mark','Vec x̂ n',true],
 ['vector-type','γ : Vec S n',true], ['vector-arrow','Vec S n → S',true],
 ['vector-paren','(Vec S n)',true], ['vector-long','Vec Carrier n',false],
 ['vector-digit','Vec A 2',true], ['vector-prime','Vec A n′',false],
 ['vector-index','Vec A n₁',false], ['vector-app','f Vec A n',false],
 ['vector-right-app','Vec A f n',false], ['vector-chain','Vec A n m',false],
 ['vector-compound','Vec A (suc n)',false], ['vector-unknown','Vec A n',false],
 ['vector-raw','Vec A n',false], ['vector-pattern','data Vec A n where',false],
 ['vector-formal','Vec A n',true], ['vector-popup','Vec A n',true],
 ['vector-untraced','Vec A n',false], ['vector-partial','Vec A',false],
 ['vector-import','using ( Vec )',false], ['vector-qualified','V.Vec A n',true],
 ['vector-natural-zero','Vec A zero',true],
 ['vector-natural-one','Vec A (suc zero)',true],
 ['vector-natural-suc','a ∷ v : Vec A (suc n)',true],
 ['vector-natural-two','Vec A (suc (suc n))',true],
 ['vector-natural-three','Vec A (suc (suc (suc n)))',true],
 ['vector-natural-formal','Vec A (suc n)',true],
 ['vector-natural-popup','Vec A (suc n)',true],
 ['vector-natural-raw','Vec A (suc n)',false],
 ['vector-natural-fin','Vec A (suc n)',false],
 ['vector-natural-long','Vec A (suc length)',false]
];
for (const [id,source] of vectorCases) {
 const element=document.createElement(['vector-pattern','vector-formal','vector-untraced','vector-natural-formal'].includes(id)?'pre':'code');
 element.id=id;element.className=id.endsWith('popup')?'type-value Agda':'Agda';
 if(id.endsWith('raw'))element.dataset.outcropNotation='source';
 const module=id==='vector-unknown'?'Other':'Example.Vector';
 element.innerHTML=source.replace(/(?:V\.)?Vec/g,name=>'<a href="Example.Vector.html#1" data-type="'+module+'#1" data-name="Vec">'+name+'</a>');
 if(id.startsWith('vector-natural-'))element.innerHTML=element.innerHTML.replace(/\b(suc|zero)\b/g,name=>
  '<a class="InductiveConstructor" data-type="Nat#1" data-constructor-family="'+(id.endsWith('fin')?'Cubical.Data.FinData.Base.Fin':'Agda.Builtin.Nat.Nat')+'">'+name+'</a>');
 if(id.endsWith('formal'))element.innerHTML='<span class="expr-node">'+element.innerHTML+'</span>';
 if(id==='vector-natural-formal')element.innerHTML=element.innerHTML.replace(/(<a class="InductiveConstructor"[^>]*>suc<\/a> n)/,
  '<span class="expr-node" data-source-notation="nat-suc" data-notation-value="n" data-notation-count="1" data-notation-type="ℕ">$1</span>');
 if(id==='vector-untraced')element.innerHTML='<span>'+element.innerHTML+'</span>';
 if(id==='vector-type')element.innerHTML=element.innerHTML.replace('S ', '<a id="vector-base">S</a> ').replace(/n$/, '<a id="vector-exponent">n</a>');
 document.querySelector('#fixture').append(element);
}
addEventListener('load',async()=>{
 await document.fonts.ready;
 const results=[];
 const check=(name,pass)=>{results.push({name,pass:!!pass});const p=document.createElement('p');p.textContent=(pass?'PASS ':'FAIL ')+name;document.querySelector('#results').append(p);};
 const by=id=>document.getElementById(id);
 const painted=node=>Array.from(node.querySelectorAll('.notation-text')).map(e=>JSON.parse(getComputedStyle(e,'::before').content)).join('');
 const view=badge=>badge.querySelector(':scope > .notation-view');
 const scriptIndex=badge=>view(badge).querySelector('.notation-index');
 const cons=word=>'<a class="InductiveConstructor" data-type="Example.Vector#2" data-constructor-family="Example.Vector.Vec">'+word+'</a>';
 const field=(name,known=true)=>'.<a class="Field" '+(known?'data-pair-projection="'+(name==='fst'?'1':'2')+'"':'')+' href="/zh/Base.Prelude.html">'+name+'</a>';
 const vectorNode=items=>{
  const node=document.createElement('span');node.dataset.vectorCandidate='true';node.dataset.vectorInline='true';
  for(const item of items){node.append('(');if(typeof item==='string'){const span=document.createElement('span');span.innerHTML=item;node.append(span);}else node.append(item);node.append(') ');const span=document.createElement('span');span.innerHTML=cons('∷');node.append(span,' ');}
  const end=document.createElement('span');end.innerHTML=cons('[]');node.append(end);
  node.dataset.vectorItems=JSON.stringify(items.map(item=>'('+(typeof item==='string'?new DOMParser().parseFromString(item,'text/html').body.textContent:item.textContent)+')'));
  return node;
 };
 const compoundCases=[
  ['successor',[ '<a class="InductiveConstructor" data-type="Nat#1" data-constructor-family="Agda.Builtin.Nat.Nat">suc</a> n' ],'[n⁺]'],
  ['projection',['p '+field('fst')],'[p․₁]'],
  ['chain',['p '+field('fst')+' '+field('snd')],'[p․₁․₂]'],
  ['repeated',['p '+field('fst'),'q '+field('fst')+' '+field('snd')],'[p․₁, q․₁․₂]'],
  ['nested',[vectorNode(['a','b']),vectorNode(['c','d'])],'[[a, b], [c, d]]'],
  ['deep',[vectorNode([vectorNode(['a'])])],'[[[a]]]']
 ];
 for(const [name,items,label] of compoundCases){
  const code=document.createElement('code');code.className='Agda';code.id='compound-'+name;code.append(vectorNode(items));by('fixture').append(code);
  const original=code.textContent;outcropDeepNotation.scan(code);
  const badge=code.querySelector('.vector-term-notation');
  check(name+' compound vector label',badge?.dataset.mathLabel===label);
  check(name+' compound source retained',code.textContent===original);
  check(name+' compound popup is raw',badge&&!badge.dataset.hoverHtml.includes('notation-view'));
  const snapshot=code.innerHTML;outcropDeepNotation.scan(code);check(name+' compound scan idempotent',snapshot===code.innerHTML);
 }
 for(const [name,source,count] of [
  ['chain','p '+field('fst')+' '+field('snd')+' '+field('fst'),3],
  ['broken','p '+field('fst',false)+' '+field('snd'),0],
  ['stopped','p '+field('fst')+' '+field('snd',false)+' '+field('fst'),1],
  ['long','pair '+field('fst')+' '+field('snd'),0]]){
  const code=document.createElement('code');code.className='Agda';code.innerHTML=source;by('fixture').append(code);
  const original=code.textContent;outcropDeepNotation.scan(code);
  check(name+' projection chain evidence',code.querySelectorAll('.pair-projection-notation').length===count);
  check(name+' projection chain source',code.textContent===original);
 }
 for(const surface of ['formal','popup','raw']){
  const code=document.createElement(surface==='formal'?'pre':'code');code.className=surface==='popup'?'type-value Agda':'Agda';
  const node=vectorNode([vectorNode(['p '+field('fst')+' '+field('snd')])]);
  if(surface==='formal')for(const part of [node,...node.querySelectorAll('[data-vector-candidate]')]){
   delete part.dataset.vectorInline;part.dataset.vectorChecked='true';part.dataset.vectorType='Vec A 1';part.className='expr-node';
  }
  if(surface==='raw')code.dataset.outcropNotation='source';
  code.append(node);by('fixture').append(code);const original=code.textContent;outcropDeepNotation.scan(code);
  check(surface+' nested chain vector',(code.querySelector('.vector-term-notation')?.dataset.mathLabel??null)===(surface==='raw'?null:'[[p․₁․₂]]'));
  check(surface+' nested original code',code.textContent===original);
 }
 const mixed=document.createElement('code');mixed.className='Agda';
 const list=vectorNode(['a']);for(const a of list.querySelectorAll('a'))a.dataset.constructorFamily='Other.List';
 mixed.append(vectorNode([list]));by('fixture').append(mixed);outcropDeepNotation.scan(mixed);
 check('nested List is not converted to Vec',mixed.querySelector('.vector-term-notation')?.dataset.mathLabel==='[(a) ∷ []]');
 const naturalCases=[
  ['natural-alone','suc n','n⁺'], ['natural-zero','zero','0'],
  ['natural-fin-index','Fin (suc n)','n⁺'], ['natural-fin-zero','Fin zero','0'],
  ['natural-formula','Formula K (suc (suc n))','n⁺⁺'],
  ['natural-function','f (suc (suc (suc n)))','n⁺³'],
  ['natural-ineligible-parent','Vec Carrier (suc n)','n⁺'],
  ['natural-grouped','f (suc ((suc n)))','n⁺⁺'],
  ['natural-unicode','𝒮 (suc n)','n⁺'], ['natural-popup','T (suc n)','n⁺'],
  ['natural-closed','suc (suc zero)','2'], ['natural-long','suc length','length⁺'],
  ['natural-raw','Fin (suc n)',null], ['natural-fin-constructor','suc n',null],
  ['natural-unlinked','suc n',null], ['natural-formal-unchecked','suc n',null],
  ['natural-explicit','suc (suc zero)','2']
 ];
 for(const [id,source,label] of naturalCases){
  const element=document.createElement(id==='natural-formal-unchecked'?'pre':'code');
  element.id=id;element.className=id==='natural-popup'?'type-value Agda':'Agda';
  if(id==='natural-raw')element.dataset.outcropNotation='source';
  if(id==='natural-explicit')element.dataset.agdaInlineType='ℕ';
  element.innerHTML=source.replace(/\b(suc|zero)\b/g,name=>
   '<a class="InductiveConstructor"'+(id==='natural-unlinked'?'':' data-type="Nat#1"')+
   ' data-constructor-family="'+(id==='natural-fin-constructor'?'Example.Fin':'Agda.Builtin.Nat.Nat')+'">'+name+'</a>');
  by('fixture').append(element);outcropDeepNotation.scan(element);
  check(id+' independent numeric presentation',(element.querySelector('.source-notation')?.dataset.mathLabel??null)===label);
  check(id+' source unchanged',element.textContent===source);
  const before=element.innerHTML;outcropDeepNotation.scan(element);
  check(id+' stable scan',before===element.innerHTML);
 }
 const naturalVector=document.createElement('code');naturalVector.className='Agda';
 naturalVector.dataset.vectorCandidate='true';naturalVector.dataset.vectorInline='true';naturalVector.dataset.vectorItems='["zero"]';
 naturalVector.innerHTML='<a class="InductiveConstructor" data-type="Nat#1" data-constructor-family="Agda.Builtin.Nat.Nat">zero</a> '+
  '<a class="InductiveConstructor" data-type="Example.Vector#2" data-constructor-family="Example.Vector.Vec">∷</a> []';
 by('fixture').append(naturalVector);outcropDeepNotation.scan(naturalVector);
 check('vector entries consume independent child presentation',naturalVector.querySelector('.vector-term-notation')?.dataset.mathLabel==='[0]');
 check('vector numeric entry source retained',naturalVector.textContent==='zero ∷ []');
 const type='<a data-type="Example.Vector#1" data-name="Vec">Vec</a> A 2';
 const termCases=[['term',true],['term-list',false],['term-unlinked',false],
  ['term-raw',false],['term-pattern',false],['term-tail',false],['term-inline',true],
  ['term-popup',true],['term-nested',true],['term-wrong-constructor',false],
  ['term-checked-plain',true],['term-unchecked-plain',false],['term-list-family',false],
  ['term-checked-linked-argument',true],['term-checked-arrow',false],
  ['term-inline-untyped',true],['term-inline-unlinked',false],
  ['term-inline-list',false],['term-inline-bare-empty',true],
  ['term-inline-parens',true],['term-display-parens',true],
  ['term-singleton',true],['term-inline-singleton',true],['term-display-singleton',true]];
 for(const [id] of termCases){
  const scope=document.createElement(id.includes('inline')||id.includes('display')?'code':'pre');scope.id=id;scope.className='Agda';
  const node=id==='term-inline'?scope:document.createElement('span');
  node.className+=(id==='term-popup'?' type-node':' expr-node');
  node.dataset.vectorCandidate='true';node.dataset.vectorItems='["a","b"]';node.dataset.vectorType=id==='term-list'?type.replaceAll('Vec','List'):type;
  if(id==='term-raw')scope.dataset.outcropNotation='source';
  if(id==='term-pattern')delete node.dataset.vectorItems;
  if(id.includes('plain'))node.dataset.vectorType='Vec A 2';
  if(id==='term-checked-plain')node.dataset.vectorChecked='true';
  if(id==='term-checked-linked-argument'){
   node.dataset.vectorChecked='true';node.dataset.vectorType='Vec (<a data-type="Example#4">S</a> 𝒮) 2';
  }
  if(id==='term-checked-arrow'){
   node.dataset.vectorChecked='true';node.dataset.vectorType='Vec A 2 → Vec A 3';
  }
  if(id.startsWith('term-inline-')||id.startsWith('term-display-')){
   node.dataset.vectorInline='true';delete node.dataset.vectorType;
  }
  if(id==='term-inline-list')node.dataset.vectorType=type.replaceAll('Vec','List');
  const mod=id==='term-wrong-constructor'?'Other':'Example.Vector';
  const family=mod+'.'+(id==='term-list-family'?'List':'Vec');
  const anchor=text=>id==='term-inline-bare-empty'&&text==='[]'?'[]':'<a class="InductiveConstructor" data-constructor-family="'+family+'"'+(id.endsWith('unlinked')?'':' data-type="'+mod+'#2"')+'>'+text+'</a>';
  node.innerHTML='<a id="'+id+'-a">a</a> '+anchor('∷')+' b '+anchor('∷')+' '+anchor('[]');
  if(id.endsWith('singleton')){
   node.dataset.vectorItems='["a"]';
   if(node.dataset.vectorType)node.dataset.vectorType=type.replace(' A 2',' A 1');
   node.innerHTML='<a id="'+id+'-a">a</a> '+anchor('∷')+' '+anchor('[]');
  }
  if(node!==scope)scope.append(node);
  if(id.endsWith('parens')){scope.prepend('((');scope.append('))');}
  if(id==='term-tail'){const outer=document.createElement('span');outer.dataset.vectorCandidate='true';node.replaceWith(outer);outer.append('f x ∷ ',node);}
  if(id==='term-nested'){const outer=document.createElement('span');node.replaceWith(outer);outer.append('f (',node,')');}
  if(id.startsWith('term-display-')){
   const display=document.createElement('div');display.className='single-line-code';
   display.append(scope);by('fixture').append(display);
  }else by('fixture').append(scope);
 }
 outcropDeepNotation.scan(document.body);
 for(const [id,expected] of termCases){
  check(id+' bracket eligibility',!!by(id).querySelector('.vector-term-notation')===expected);
  check(id+' original source retained',by(id).textContent.includes(id.endsWith('singleton')?'a ∷ []':'a ∷ b ∷ []'));
  if(id.endsWith('singleton'))check(id+' singleton label',by(id).querySelector('.vector-term-notation')?.dataset.mathLabel==='[a]');
 }
 const term=by('term').querySelector('.vector-term-notation');
 check('bracket notation painted',painted(view(term))==='[a, b]');
 check('vector term has type and original linked constructors',term.dataset.hoverHtml.includes('data-type="Example.Vector#2"')&&term.dataset.hoverHtml.includes('Vec'));
 check('vector term preserves original anchor once',document.querySelectorAll('#term-a').length===1);
 for(const id of ['term-inline-parens','term-display-parens']){
  check(id+' redundant parentheses hidden',by(id).querySelectorAll('.notation-elided-parenthesis').length===4);
  check(id+' copied parentheses retained',by(id).textContent==='((a ∷ b ∷ []))');
 }
 check('inline no invented type',!by('term-inline-untyped').querySelector('.vector-term-notation').dataset.hoverHtml.includes('source-notation-type'));
 const termHTML=by('term').innerHTML;outcropDeepNotation.scan(by('term'));
 check('vector term scan idempotent',termHTML===by('term').innerHTML);
 const inlineHTML=by('term-inline').innerHTML;outcropDeepNotation.scan(by('term-inline'));
 check('inline root scan idempotent',inlineHTML===by('term-inline').innerHTML);
 check('single-letter postfix is compact',by('pair').querySelector('.pair-projection-notation')?.dataset.mathLabel==='․₁');
 check('suffix is actually painted',painted(view(by('pair').querySelector('.pair-projection-notation')))==='․₁');
 check('suffix spacing is tightened',parseFloat(getComputedStyle(by('pair').querySelector('.notation-style-pair-projection')).letterSpacing)<0);
 check('original source survives copying',by('pair').textContent==='p .fst');
 check('raw source popup retains field link',by('pair').querySelector('[data-hover-html]')?.dataset.hoverHtml.includes('href="/zh/Base.Prelude.html"'));
 for(const id of ['long','application','raw','unknown','import','record-long'])check(id+' stays raw',!by(id).querySelector('.source-notation'));
 check('record receiver is a subscript',!!by('record').querySelector('.record-projection-notation'));
 const record=by('record').querySelector('.record-projection-notation');
 const ratio=parseFloat(getComputedStyle(scriptIndex(record)).fontSize)/parseFloat(getComputedStyle(record).fontSize);
 check('subscript font stays at 72 percent',Math.abs(ratio-.72)<.01);
 check('short compound instance permitted',!!by('record-complex').querySelector('.record-projection-notation'));
 check('compound subscript has no display spaces',painted(scriptIndex(by('record-complex').querySelector('.record-projection-notation')))==='𝒮↾M');
 check('record source parentheses preserved',by('record-complex').textContent==='S (𝒮 ↾ M)');
 check('nested compiler expression is respected',!!by('multi').querySelector('.pair-projection-notation'));
 check('original anchors survive',!!by('multi').querySelector('#field-anchor'));
 const html=by('pair').innerHTML;outcropDeepNotation.scan(by('pair'));check('scan is idempotent',html===by('pair').innerHTML);
 const popup=document.createElement('div');popup.className='type-value Agda';popup.innerHTML='p .<a class="Field" data-pair-projection="2">snd</a>';by('fixture').append(popup);outcropDeepNotation.scan(popup);
 check('dynamic type popup uses same lens',!!popup.querySelector('.pair-projection-notation'));
 for(const [id,source,expected] of vectorCases){
  check(id+' eligibility',!!by(id).querySelector('.vector-notation')===expected);
  check(id+' source unchanged',by(id).textContent===source);
 }
 const vector=by('vector').querySelector('.vector-notation');
 check('vector exponent painted',painted(scriptIndex(vector))==='n');
 check('vector exponent is raised',getComputedStyle(scriptIndex(vector)).verticalAlign==='super');
 for(const [id,label] of [['zero','0'],['one','1'],['suc','n⁺'],['two','n⁺⁺'],['three','n⁺³'],['formal','n⁺'],['popup','n⁺']]){
  const badge=by('vector-natural-'+id).querySelector('.vector-notation');
  check(id+' natural exponent',badge?.dataset.mathLabel==='A^'+label);
  const ordinary=label.replace(/[⁺⁰¹²³⁴⁵⁶⁷⁸⁹]/gu,c=>'+0123456789'['⁺⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c)]);
  check(id+' painted natural exponent',badge&&painted(scriptIndex(badge))===ordinary);
  if(label.startsWith('n'))check(id+' nested exponent retained',badge&&scriptIndex(badge).querySelector('.notation-index.notation-super'));
  check(id+' raw source popup',badge&&!badge.dataset.hoverHtml.includes('class="nat-suc-notation'));
  const scope=by('vector-natural-'+id), before=scope.innerHTML;
  outcropDeepNotation.scan(scope);
  check(id+' repeated scan stable',scope.innerHTML===before);
  if(badge){
   const popup=document.createElement('code');popup.className='Agda';popup.innerHTML=badge.dataset.hoverHtml;
   by('fixture').append(popup);outcropDeepNotation.scan(popup);
   check(id+' source popup stays raw',!popup.querySelector('.source-notation')&&popup.textContent===scope.textContent.slice(scope.textContent.indexOf('Vec')));
  }
 }
 check('vector popup has original linked code',vector.dataset.hoverHtml.includes('data-name="Vec"'));
 const vectorHTML=by('vector').innerHTML;outcropDeepNotation.scan(by('vector'));
 check('vector scan idempotent',by('vector').innerHTML===vectorHTML);
 check('partial vector preserves unique anchors',document.querySelectorAll('#vector-base').length===1&&document.querySelectorAll('#vector-exponent').length===1&&!!by('vector-type').querySelector('.universe-source #vector-exponent'));
 const failures=results.filter(r=>!r.pass);by('status').textContent=failures.length?'FAIL '+failures.length:'PASS '+results.length;
 window.projectionResults=results;
});
</script></body></html>
